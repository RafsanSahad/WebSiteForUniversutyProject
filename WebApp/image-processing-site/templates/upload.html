<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Upload & Convert Images</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>🖼️ Convert Your Images</h1>

    <form id="upload-form" action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="file" id="fileElem" multiple accept="image/*" style="display:none" name="images">
        <div id="drop-area">
            <p>Drag & drop images here or click to upload</p>
            <p class="file-restrictions">(Max 50MB • JPG, PNG, WEBP, HEIC)</p>
        </div>
        <div id="preview"></div>
        <button class="upload-btn" type="submit">Upload & Convert</button>
    </form>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileElem = document.getElementById('fileElem');
        const preview = document.getElementById('preview');
        let uploadedFiles = [];

        // Event Handlers
        dropArea.addEventListener('click', () => fileElem.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => {
                e.preventDefault();
                dropArea.classList.add('highlight');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => {
                e.preventDefault();
                dropArea.classList.remove('highlight');
            });
        });

        dropArea.addEventListener('drop', handleDrop);
        fileElem.addEventListener('change', handleFileSelect);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            handleFiles(dt.files);
        }

        function handleFileSelect(e) {
            handleFiles(e.target.files);
        }

        function handleFiles(files) {
            const validFiles = Array.from(files).filter(file => 
                file.type.startsWith('image/') && 
                ['image/jpeg', 'image/png', 'image/webp', 'image/heic'].includes(file.type)
            );

            if (validFiles.length === 0) {
                alert('Only JPG, PNG, WEBP, and HEIC files are allowed!');
                return;
            }

            uploadedFiles = [...uploadedFiles, ...validFiles];
            previewFiles(uploadedFiles);
            updateFileInput();
        }

        function previewFiles(files) {
            preview.innerHTML = '';
            
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'preview-item';
                    wrapper.dataset.index = index;

                    wrapper.innerHTML = `
                        <img src="${e.target.result}" alt="${file.name}">
                        <div class="file-info">
                            <span>${file.name}</span>
                            <button class="remove-btn" onclick="removeFile(${index})">&times;</button>
                        </div>
                    `;
                    
                    preview.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            previewFiles(uploadedFiles);
            updateFileInput();
        }

        function updateFileInput() {
            const dataTransfer = new DataTransfer();
            uploadedFiles.forEach(file => dataTransfer.items.add(file));
            fileElem.files = dataTransfer.files;
        }

        // Form validation
        document.getElementById('upload-form').addEventListener('submit', function(e) {
            if (uploadedFiles.length === 0) {
                e.preventDefault();
                alert('Please select at least one image to upload!');
            }
        });
        
        
    </script>
    <div class="loading-spinner"></div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.querySelector('.loading-spinner').style.display = 'block';
        });
    </script>
</body>
</html>
