<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Resize Images</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>📏 Resize Your Image</h1>
    
    <form id="resize-form" action="{{ url_for('resize') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="file" id="fileElem" accept="image/*" name="image" style="display:none">
        <div id="drop-area">
            <p>Drag & drop image here or click to upload</p>
        </div>
        <div id="preview"></div>
        <div class="resize-options">
            <div>
                <label>Width: <input type="number" name="width" min="1" required></label>
                <label>Height: <input type="number" name="height" min="1" required></label>
            </div>
            <div>
                <label>Output Format:
                    <select name="format">
                        <option value="jpg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </label>
            </div>
        </div>
        <button class="upload-btn" type="submit">Process Image</button>
    </form>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileElem = document.getElementById('fileElem');
        const preview = document.getElementById('preview');
        let currentFile = null;

        // Event Handlers
        dropArea.addEventListener('click', () => fileElem.click());
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight);
        });

        dropArea.addEventListener('drop', handleDrop);
        fileElem.addEventListener('change', handleFileSelect);

        function highlight(e) {
            e.preventDefault();
            dropArea.classList.add('highlight');
        }

        function unhighlight(e) {
            e.preventDefault();
            dropArea.classList.remove('highlight');
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            handleFiles(dt.files);
        }

        function handleFileSelect(e) {
            handleFiles(e.target.files);
        }

        function handleFiles(files) {
            preview.innerHTML = '';
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                currentFile = files[0];
                previewFile(currentFile);
            } else {
                alert('Please upload a valid image file');
            }
        }

        function previewFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `
                    <div class="preview-item">
                        <img src="${e.target.result}" alt="${file.name}">
                        <button class="remove-btn" onclick="removeFile()">&times;</button>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }

        function removeFile() {
            preview.innerHTML = '';
            fileElem.value = '';
            currentFile = null;
        }

        // Form validation
        document.getElementById('resize-form').addEventListener('submit', function(e) {
            if (!currentFile) {
                e.preventDefault();
                alert('Please select an image first');
            }
        });
    </script>
    <div class="loading-spinner"></div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.querySelector('.loading-spinner').style.display = 'block';
        });
    </script>
</body>
</html>
